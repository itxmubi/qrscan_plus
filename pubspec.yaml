name: qrscan_plus
description: A Flutter plugin for scanning QR codes and barcodes from camera, gallery, files, or bytes, and generating QR code PNGs on Android and iOS.
version: 2.0.1
homepage: https://github.com/itxmubi/qrscan_plus
repository: https://github.com/itxmubi/qrscan_plus
issue_tracker: https://github.com/itxmubi/qrscan_plus/issues
documentation: https://github.com/itxmubi/qrscan_plus#readme

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.shinow.qrscan
        pluginClass: QrscanPlugin
      ios:
        pluginClass: SwiftQrscanPlugin
